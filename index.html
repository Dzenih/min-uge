  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 16px; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }

  .hidden { display: none !important; }

  header .date { font-size: 13px; opacity: .9; text-transform: capitalize; }

  header .sub { font-size: 13px; opacity: .95; margin-top: 4px; }

  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; }

  nav button { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--muted); padding: 4px 0; gap: 2px; }

  nav button.on { color: var(--teal); font-weight: 600; }

  /* Rings */
  .rings { display: grid; grid-template-columns: 130px 1fr; gap: 14px; align-items: center; }
  .ring { position: relative; width: 130px; height: 130px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .c b { font-size: 26px; }
  .ring .c span { font-size: 12px; color: var(--muted); }
  .bar { height: 12px; background: #eef2f1; border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 99px; transition: width .4s; }
  .stat { margin-bottom: 10px; }
  .stat .row { font-size: 14px; margin-bottom: 4px; }

  /* Chips & buttons */
  .btn { background: var(--teal); color: #fff; border-radius: 14px; padding: 12px 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
  .btn.ghost { background: #ecfdf5; color: var(--teal); }
  .btn.gray { background: #f1f5f9; color: var(--ink); }
  .btn.full { width: 100%; }
  .btn.small { padding: 7px 11px; font-size: 14px; border-radius: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .action { background: #fff; border-radius: 18px; padding: 16px 10px; text-align: center; box-shadow: 0 1px 3px rgba(15,23,42,.06); }
  .action .e { font-size: 30px; display: block; }
  .action b { display: block; margin-top: 4px; font-size: 15px; }
  .action span { font-size: 12px; color: var(--muted); }

  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chk { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 12px; background: #f8fafc; border: 1px solid var(--line); font-size: 14px; text-align: left; }
  .chk .b { width: 22px; height: 22px; border-radius: 7px; border: 2px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; flex: none; }
  .chk.on { background: #ecfdf5; border-color: #a7f3d0; }
  .chk.on .b { background: var(--teal); border-color: var(--teal); }
  .water { display: flex; gap: 6px; flex-wrap: wrap; }
  .water button { font-size: 24px; opacity: .25; }
  .water button.on { opacity: 1; }

  /* Food list */
  .entry { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #f1f5f9; }
  .entry:last-child { border-bottom: none; }
  .thumb { width: 48px; height: 48px; border-radius: 12px; background: #fff7ed; display: flex; align-items: center; justify-content: center; font-size: 24px; flex: none; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .entry .t { flex: 1; min-width: 0; }
  .entry .t b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry .k { text-align: right; font-size: 14px; font-weight: 600; }
  .entry .k span { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  .del { color: #94a3b8; font-size: 18px; padding: 4px; }
  .star { font-size: 18px; padding: 4px; color: #cbd5e1; } .star.on { color: #f59e0b; }

  .wtog button.on { background:#fff; color:#0f172a; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  .why { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .why span { background:#fff; border-radius:99px; padding:4px 10px; font-size:12px; border:1px solid #e2e8f0; }
  .wk .loc { display:block; border:0; background:#f1f5f9; border-radius:8px; margin-top:4px; padding:2px 0; font-size:14px; width:100%; }
  .moved { margin-top: 8px; font-size: 12px; background: rgba(255,255,255,.6); border-radius: 99px; padding: 4px 10px; display: inline-block; }

  .sh { margin: 14px 0 8px; font-size: 14px; color: #475569; }
  .opt.sel { border-color: var(--teal); background: #f0fdfa; }
  .shead { display: flex; align-items: center; justify-content: space-between; gap: 10px; } .shead h3 { margin: 0 0 10px; } .shead .btn { margin-bottom: 10px; }
  .added { background: #ecfdf5; border-radius: 14px; padding: 10px; margin-bottom: 10px; }
  .added .sum { font-size: 14px; margin-bottom: 6px; } .added .sum b { color: var(--orange); }
  .added .chip { display: inline-flex; align-items: center; gap: 4px; background: #fff; border: 1px solid #a7f3d0; border-radius: 99px; padding: 4px 4px 4px 10px; margin: 0 4px 4px 0; font-size: 13px; }
  .added .chip button { border: 0; background: #f1f5f9; border-radius: 99px; width: 22px; height: 22px; font-size: 11px; color: #64748b; }
  .tabs { display: flex; background: #f1f5f9; border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 8px 4px; border-radius: 10px; font-size: 14px; color: var(--muted); }
  .tabs button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .opt { display: flex; align-items: center; gap: 10px; padding: 11px 10px; border-radius: 12px; width: 100%; text-align: left; border: 1px solid var(--line); margin-bottom: 7px; background: #fff; }
  .opt .e { font-size: 24px; }
  .opt .t { flex: 1; }
  .opt .t b { display: block; font-size: 15px; }
  .opt .t span { font-size: 12px; color: var(--muted); }
  .opt .plus { width: 30px; height: 30px; border-radius: 50%; background: var(--teal); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .field { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: #f8fafc; margin-bottom: 10px; }
  .photo-prev { width: 100%; max-height: 220px; object-fit: cover; border-radius: 14px; margin-bottom: 10px; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 10px 0; }
  .stepper button { width: 44px; height: 44px; border-radius: 50%; background: #f1f5f9; font-size: 22px; font-weight: 600; }
  .stepper input { width: 90px; text-align: center; font-size: 22px; font-weight: 700; border: none; border-bottom: 2px solid var(--line); padding: 4px; background: transparent; }
  .parse { margin: -2px 0 10px; }
  .pl { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: #f0fdf4; margin-bottom: 6px; font-size: 14px; }
  .pl .e { font-size: 22px; } .pl .t { flex: 1; } .pl .v { text-align: right; white-space: nowrap; color: var(--orange); font-weight: 600; }
  .pl .v small { color: #64748b; font-weight: 500; }
  .pl.unk { background: #fff7ed; } .pl.tot { background: #ecfeff; }
  textarea.field { resize: none; font: inherit; }
  .lbl { font-size: 12px; color: #64748b; } .lbl .field { margin-top: 4px; font-size: 16px; color: inherit; }
  .calc { text-align: center; font-size: 15px; margin-bottom: 12px; }

  .days button.on { background: var(--teal); color: #fff; }
  .days button.today::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--orange); }

  .hero { border-radius: 18px; padding: 16px; margin-bottom: 12px; color: #0b1324; }

  .hero h2 { margin: 4px 0 2px; font-size: 22px; }
  .t-walk { background: #bae6fd; } .t-str { background: #fecaca; } .t-run { background: #bbf7d0; } .t-rest { background: #e5e7eb; } .t-row { background: #ddd6fe; }

  .ex .top .t b { display: block; font-size: 16px; }

  .ex .chev { color: #94a3b8; transition: transform .2s; }

  .ex .body { padding: 0 12px 12px; }
  .fig { background: linear-gradient(#f8fafc, #eef6f4); border-radius: 14px; margin-bottom: 10px; }

  .timer { text-align: center; }
  .timer .seg { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .timer .clock { font-size: 56px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .timer .next { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .segs { display: flex; gap: 2px; height: 10px; margin: 10px 0 14px; border-radius: 99px; overflow: hidden; }
  .segs div { height: 100%; }
  .rest { position: fixed; left: 12px; right: 12px; bottom: calc(84px + env(safe-area-inset-bottom)); background: #0f172a; color: #fff; border-radius: 18px; padding: 12px 16px; z-index: 30; display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: 536px; margin: 0 auto; }
  .rest b { font-size: 28px; font-variant-numeric: tabular-nums; }
  .rest .t { flex: 1; font-size: 14px; }
  .toast { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 99px; font-size: 14px; z-index: 60; box-shadow: 0 6px 18px rgba(0,0,0,.2); white-space: nowrap; }

  /* Week */
  .wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .wk .d { background: #f8fafc; border-radius: 12px; padding: 7px 2px; text-align: center; font-size: 12px; border: 1px solid var(--line); }
  .wk .d.today { border-color: var(--teal); border-width: 2px; }
  .wk .d b { display: block; font-size: 13px; }
  .wk .d .e { font-size: 18px; display: block; margin: 3px 0; }
  .wk .mini { height: 40px; width: 12px; margin: 4px auto 2px; background: #eef2f1; border-radius: 6px; position: relative; overflow: hidden; }
  .wk .mini div { position: absolute; bottom: 0; left: 0; right: 0; background: var(--orange); border-radius: 6px; }
  .phase { border-radius: 14px; padding: 12px; font-size: 14px; }
  .settings label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
</style>
</head>

let MATCHERS = [];
function loadLearned(){ (state.learned || []).forEach(f => { if (!FOOD_DB.some(x => x[0] === f[0])) FOOD_DB.push(f); ALIAS[f[0]] = f[6]; }); buildMatchers(); }
function buildMatchers(){
  MATCHERS = [];
  FOOD_DB.forEach(f => (ALIAS[f[0]] || f[0].toLowerCase().split(/[ ,/(]/)[0]).split('|').forEach(a => {
    a = a.trim(); if (!a) return;
    const tail = a.length >= 4 ? '[a-zæøåéü]*' : '(?![a-zæøåéü])';
    MATCHERS.push({ f, len: a.length, re: new RegExp('(^|[^a-zæøåéü0-9])(' + a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + tail + ')', 'g') });
  }));
  MATCHERS.sort((x, y) => y.len - x.len);
}

function parseQty(txt){
  // finder sidste tal + enhed i et stykke tekst
  const toks = txt.toLowerCase().replace(/(\d)([a-zæøå½])/g, '$1 $2').replace(/(\d),(\d)/g, '$1.$2').split(/\s+/).filter(Boolean);
  let num = null, unit = null;
  for (let i = 0; i < toks.length; i++) {
    let t = toks[i], n = null;
    const m = t.match(/^(\d+(?:\.\d+)?)(½)?$/);
    if (m) n = +m[1] + (m[2] ? .5 : 0);
    else if (t === 'et' && toks[i+1] === 'par') { n = 2; i++; }
    else if (t in NUMW) n = NUMW[t];
    if (n !== null) { num = (t === 'halv' || t === 'halvt' || t === 'halve') && num ? num * .5 : n; unit = null;
      const nx = toks[i+1]; if (nx) { const u = UNITS.find(([re]) => re.test(nx)); if (u) { unit = u[1]; i++; } } continue; }
    const u = UNITS.find(([re]) => re.test(t)); if (u && num === null) { num = 1; unit = u[1]; }
  }
  return { num, unit };
}
function gramsFor(f, q){
  const portion = f[4], piece = PIECE[f[0]];
  if (q.num === null) return portion;
  if (typeof q.unit === 'number') return q.num * q.unit;
  if (q.unit === 'hand') return q.num * (/håndfuld/.test(f[5]) ? portion : 30);
  if (q.unit === 'n') return q.num * (piece || portion);
  if (q.num >= 20) return q.num;              // "150 kylling" = gram
  return q.num * (piece || portion);
}
function parseMeal(text){
  const items = [], unknown = [];
  let prevSep = '';
  text.split(/(\n|,(?!\d)|;|\+|\.(?!\d)|\bog\b|\bmed\b|\bsamt\b|\bplus\b)/i).forEach((seg, si) => {
    if (si % 2) { prevSep = seg.toLowerCase(); return; }
    const s = seg.toLowerCase(); if (!s.trim()) return;
    const hits = [], used = new Array(s.length).fill(false);
    MATCHERS.forEach(m => { m.re.lastIndex = 0; let r;
      while ((r = m.re.exec(s))) { const st = r.index + r[1].length, en = st + r[2].length;
        if (used.slice(st, en).some(Boolean) || hits.some(h => h.f === m.f)) continue;
        used.fill(true, st, en); hits.push({ f: m.f, st, en }); } });
    if (!hits.length) {
      const rest = s.replace(/\d+([.,]\d+)?/g, ' ').replace(STOP, ' ').split(/\s+/).filter(w => w && !UNITS.some(([re]) => re.test(w)) && !(w in NUMW)).join(' ').trim();
      if (rest.length >= 2) unknown.push({ q: rest, qty: parseQty(s) });
      return;
    }
    hits.sort((a, b) => a.st - b.st);
    hits.forEach((h, i) => {
      const before = s.slice(i ? hits[i-1].en : 0, h.st), after = s.slice(h.en, i < hits.length-1 ? hits[i+1].st : s.length);
      let q = parseQty(before); if (q.num === null && i === hits.length-1) q = parseQty(after);
      let g = gramsFor(h.f, q);
      if (prevSep === 'med' && /mælk/i.test(h.f[0]) && typeof q.unit !== 'number') g = (q.num || 1) * 50;   // mælk i kaffe/te
      items.push({ f: h.f, g, kcal: h.f[2]*g/100, p: h.f[3]*g/100 });
    });
  });
  return { items, unknown };
}

function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ toast('Hukommelsen er fuld – slet nogle billeder'); } }
function iso(d){ return d.toLocaleDateString('sv-SE'); }
function mondayOf(d){ const x = new Date(d); const w = (x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(12,0,0,0); return x; }
function day(k = iso(new Date())){ return state.days[k] || (state.days[k] = { food:[], sets:{}, done:false, checks:{}, water:0 }); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function r0(n){ return Math.round(n); }
function totals(k){ const d = day(k); return d.food.reduce((a,f) => ({ kcal:a.kcal+f.kcal, p:a.p+f.p }), { kcal:0, p:0 }); }
function weekInfo(){
  const start = new Date(state.settings.programStart + 'T12:00:00');
  const diff = Math.floor((mondayOf(new Date()) - mondayOf(start)) / (7*864e5));
  return WEEKS[((diff % 4) + 4) % 4];
}
function cyclePhase(k = iso(new Date())){
  const cs = state.settings.cycleStart; if (!cs) return null;
  const len = +state.settings.cycleLen || 28;
  const diff = Math.floor((new Date(k+'T12:00:00') - new Date(cs+'T12:00:00')) / 864e5);
  if (diff < 0) return null;
  const d = (diff % len) + 1;
  if (d <= 5) return { d, name:'Menstruation', e:'🩸', c:'#fff1f2', tip:'Let til moderat træning. Spis jernrigt (æg, bønner, linser, kød) med C-vitamin. Spring intervaller over, hvis du er træt.' };
  if (d <= 13) return { d, name:'Follikelfase', e:'⚡', c:'#f0fdf4', tip:'Fuld plan – bedste tid til intervaller og til at gøre øvelserne sværere.' };
  if (d <= 16) return { d, name:'Ægløsning', e:'🌟', c:'#fffbeb', tip:'Fuld plan. Varm godt op.' };
  return { d, name:'Lutealfase', e:'🌙', c:'#f5f3ff', tip:'Mere appetit er normalt – læg 100–150 kcal oveni, fx skyr. Lidt mindre kondition er ok.' };
}

}

function figure(id){
  const ex = EX[id], A = full(ex.A), B = full(ex.B);
  const dur = '2.8s', ks = 'keySplines=".45 0 .55 1;.45 0 .55 1" calcMode="spline" keyTimes="0;.5;1"';
  const an = (attr, a, b) => a === b ? '' : `<animate attributeName="${attr}" values="${a};${b};${a}" dur="${dur}" repeatCount="indefinite" ${ks}/>`;
  const line = (j1, j2, col, w) => `<line x1="${A[j1][0]}" y1="${A[j1][1]}" x2="${A[j2][0]}" y2="${A[j2][1]}" stroke="${col}" stroke-width="${w}" stroke-linecap="round">
      ${an('x1',A[j1][0],B[j1][0])}${an('y1',A[j1][1],B[j1][1])}${an('x2',A[j2][0],B[j2][0])}${an('y2',A[j2][1],B[j2][1])}</line>`;
  const dot = (j, r, fill) => `<circle cx="${A[j][0]}" cy="${A[j][1]}" r="${r}" fill="${fill}">${an('cx',A[j][0],B[j][0])}${an('cy',A[j][1],B[j][1])}</circle>`;
  const back = '#94a3b8', front = '#0f766e';
  let s = `<svg viewBox="0 -14 200 172" xmlns="http://www.w3.org/2000/svg">${ex.props || '<line x1="20" y1="151" x2="180" y2="151" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>'}`;
  s += line('p','kr',back,7) + line('kr','fr',back,7) + line('n','er',back,6) + line('er','hr',back,6);
  s += line('n','p',front,8) + line('p','kl',front,7) + line('kl','fl',front,7) + line('n','el',front,6) + line('el','hl',front,6);
  s += dot('h', 11, front);
  if (ex.db === 'both' || ex.db === 'one' || ex.db === 'l') s += dot('hl', 6, '#f97316');
  if (ex.db === 'both') s += dot('hr', 6, '#fb923c');
  return s + '</svg>';
}
function full(o){ const r = Object.assign({}, o); r.kr = r.kr || r.kl; r.fr = r.fr || r.fl; r.er = r.er || r.el; r.hr = r.hr || r.hl; return r; }

// Foreslår at flytte hård træning til hjemmedage og let træning til kontordage (kun dage fra i dag og frem)
function workSuggest(wd){
  const today = new Date().getDay(), idx = w => ORDER.indexOf(w);
  if (idx(wd) < idx(today) || (state.days[keyForWeekday(wd)] || {}).done) return null;
  const me = schFor(wd), loc = workAt(wd);
  const later = ORDER.filter(w => w !== wd && idx(w) >= idx(today) && !(state.days[keyForWeekday(w)] || {}).done);
  if (loc === 'home' && LIGHT.includes(me.type)) {
    const t = later.find(w => schFor(w).type === 'str' && workAt(w) === 'office') ?? later.find(w => HEAVY.includes(schFor(w).type) && workAt(w) === 'office') ?? later.find(w => schFor(w).type === 'str' && idx(w) > idx(wd));
    if (t == null) return null;
    return { e:'💡', text:`Du er hjemme ${DAYNAMES[wd].toLowerCase()} og har mere tid. Vil du tage ${schFor(t).e} ${schFor(t).title} i dag og flytte ${me.e} ${me.title} til ${DAYNAMES[t].toLowerCase()}?`, a:wd, b:t };
  }
  if (loc === 'office' && HEAVY.includes(me.type)) {
    const t = later.find(w => LIGHT.includes(schFor(w).type) && workAt(w) === 'home');
    if (t == null) return { e:'🚗', text:`Kontordag med ${me.title}: tag den korte version (2 sæt / 20 min), hvis du er træt efter køreturen.` };
    return { e:'💡', text:`Du er på kontoret ${DAYNAMES[wd].toLowerCase()}. Vil du flytte ${me.e} ${me.title} til ${DAYNAMES[t].toLowerCase()}, hvor du er hjemme, og tage ${schFor(t).e} ${schFor(t).title} i dag?`, a:wd, b:t };
  }
  return null;
}
function suggestCard(wd){ const sg = workSuggest(wd); if (!sg) return '';
  return `<div class="card" style="background:#eff6ff"><div style="font-size:14px">${sg.e} ${sg.text}</div>${sg.b != null ? `<button class="btn small" style="margin-top:8px" onclick="swapDays(${sg.a},${sg.b})">⇄ Ja, byt</button>` : ''}</div>`; }

/* ================= DAGLIGE MÅL ================= */
function wdOfKey(k){ return new Date(k+'T12:00:00').getDay(); }
function curWeight(k = iso(new Date())){ const ws = state.weights.filter(w => w.date <= k).sort((a,b) => a.date < b.date ? -1 : 1); return ws.length ? ws[ws.length-1].kg : 65; }
function weightRate(k = iso(new Date())){ // kg tabt pr. uge over de seneste 1-5 uger
  const ws = state.weights.filter(w => w.date <= k).sort((a,b) => a.date < b.date ? -1 : 1); if (ws.length < 2) return 0;
  const last = ws[ws.length-1], lt = new Date(last.date+'T12:00:00');
  const old = ws.filter(w => { const d = (lt - new Date(w.date+'T12:00:00')) / 864e5; return d >= 6 && d <= 35; })[0]; if (!old) return 0;
  return (old.kg - last.kg) / ((lt - new Date(old.date+'T12:00:00')) / (7*864e5));
}
function schForKey(k){ const wd = wdOfKey(k); return keyForWeekday(wd) === k ? schFor(wd) : SCHEDULE[wd]; }
function goalFor(k = iso(new Date())){
  const g = state.settings, w = curWeight(k), h = +g.height || 170, a = +g.age || 31;
  const bmr = Math.round(10*w + 6.25*h - 5*a - 161), sch = schForKey(k), ph = cyclePhase(k), rate = weightRate(k);
  const burn = { rest:0, walk:75, str:125, row:150, run:150 }[sch.type] || 0;
  const why = [`Hvilestofskifte ${bmr}`, `Hverdag ×1,45`, `Skånsomt underskud −400`];
  let kcal = bmr*1.45 - 400;
  if (burn) { kcal += burn; why.push(`${sch.e} ${sch.title} +${burn}`); }
  let tips = [];
  if (sch.type === 'str') tips.push('🍌 Efter styrke: banan eller skyr inden for 1 time');
  if (['row','run'].includes(sch.type)) tips.push('🍞 Kondi: lidt ekstra kulhydrat, fx en skive rugbrød mere');
  if (ph && ph.name === 'Lutealfase') { kcal += 125; why.push('🌙 Lutealfase +125'); tips.push('🥛 Lutealfase: skyr med bær er en god ekstra snack'); }
  if (ph && ph.name === 'Menstruation') tips.push('🩸 Menstruation: jernrigt (æg, linser, kød) med C-vitamin');
  if (rate > 0.75) { kcal += 150; why.push(`⚖️ Hurtigt vægttab (${rate.toFixed(1).replace('.',',')} kg/uge) +150`); tips.push('⚠️ Du taber dig hurtigere end anbefalet – spis lidt mere for at passe på stofskiftet'); }
  kcal = Math.max(bmr, 1200, Math.round(kcal/10)*10);
  const p = Math.round(w*1.7/5)*5;
  if (!g.auto) return { kcal: +g.kcal || kcal, p: +g.protein || p, auto:false, why:['Egne mål (sat i Indstillinger)'], tips, bmr, w, autoK:kcal, autoP:p };
  why.push(`Protein 1,7 g × ${String(w).replace('.',',')} kg`);
  return { kcal, p, auto:true, why, tips, bmr, w, autoK:kcal, autoP:p };
}
function goalCard(k){ const G = goalFor(k);
  return `<div class="card" style="background:#fff7ed"><h2>🎯 Dagens mål: ${G.kcal} kcal · ${G.p} g protein</h2>
    <div class="why">${G.why.map(x => `<span>${x}</span>`).join('')}</div>
    ${G.tips.length ? `<div style="font-size:14px;margin-top:8px">${G.tips.join('<br>')}</div>` : ''}
    ${!G.auto ? `<div class="muted" style="margin-top:6px">Automatisk ville være ${G.autoK} kcal · ${G.autoP} g. <a href="#" onclick="setS('auto',true);render();return false">Brug automatisk</a></div>` : ''}</div>`; }
function segsFor(wd, w){
  if (wd === 1) return [['Rolig gang', 20*60, '#38bdf8']];
  if (wd === 2) return [['Opvarmning, roligt', 180, '#7dd3fc'], ['Rask gang 5–6 km/t', (w.walk-6)*60, '#0284c7'], ['Nedkøling', 180, '#7dd3fc']];
  if (wd === 5) { const s = [['Gangbånd, rask gang', w.walk*60 - 600, '#0284c7']]; for (let i=0;i<5;i++) s.push(['Ro lidt hurtigere', 60, '#7c3aed'], ['Ro roligt', 60, '#c4b5fd']); return s; }
  if (wd === 6) {
    const s = [['Opvarmning: gang', 300, '#86efac']];
    if (!w.int) s.push(['Rolig tur, gang eller let jog', 30*60, '#16a34a']);
    else for (let i=0;i<w.int[2];i++) s.push([`Jog (${i+1}/${w.int[2]})`, w.int[0], '#16a34a'], ['Gang', w.int[1], '#bbf7d0']);
    s.push(['Nedkøling: gang', 300, '#86efac']); return s;
  }
  return [['Gang', 1800, '#38bdf8']];
}

/* Interval-timer */
const timer = { run:false, segs:[], i:0, left:0, end:0, key:null, id:null };
function timerCard(segs, label, key){
  const total = segs.reduce((a,s) => a+s[1], 0);
  const active = timer.key === key && timer.segs.length;
  const cur = active ? timer.segs[timer.i] : segs[0];
  return `<div class="card timer">
    <div class="muted">${label} · i alt ${Math.round(total/60)} min · ${segs.length} trin</div>
    <div class="segs">${segs.map((s,i) => `<div style="flex:${s[1]};background:${s[2]};opacity:${active && i<timer.i ? .35 : 1}"></div>`).join('')}</div>
    <div class="seg" id="tSeg">${cur[0]}</div>
    <div class="clock" id="tClock">${fmt(active ? timer.left : cur[1])}</div>
    <div class="next" id="tNext">${segs[1] ? 'Næste: ' + segs[1][0] : ''}</div>
    <div class="row" style="justify-content:center">
      ${timer.run && timer.key === key ? `<button class="btn" onclick="pauseTimer()">⏸ Pause</button>` : `<button class="btn" onclick='startTimer(${JSON.stringify(segs)}, "${key}")'>▶ ${active ? 'Fortsæt' : 'Start'}</button>`}
      ${active ? `<button class="btn gray" onclick="skipSeg()">⏭ Spring over</button><button class="btn gray" onclick="resetTimer()">↺</button>` : ''}
    </div>
    <div class="muted" style="margin-top:8px">Telefonen bipper og vibrerer ved skift. Hold skærmen tændt.</div>
  </div>`;
}
let tInt = null, wakeLock = null;
function startTimer(segs, key){
  beep(660, .05);
  if (timer.key !== key || !timer.segs.length) Object.assign(timer, { segs, i:0, left:segs[0][1], key });
  timer.run = true; timer.end = Date.now() + timer.left*1000;
  clearInterval(tInt); tInt = setInterval(tick, 250);
  try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => wakeLock = l).catch(()=>{}); } catch(e){}
  render();
}
function pauseTimer(){ timer.run = false; timer.left = (timer.end - Date.now())/1000; clearInterval(tInt); render(); }
function resetTimer(){ clearInterval(tInt); Object.assign(timer, { run:false, segs:[], i:0, left:0, key:null }); render(); }
function skipSeg(){ timer.end = Date.now(); if (!timer.run) { timer.left = 0; nextSeg(); render(); } }
function nextSeg(){
  timer.i++;
  if (timer.i >= timer.segs.length) {
    clearInterval(tInt); timer.run = false; beep(988,.3); setTimeout(() => beep(1318,.4), 300); vibrate([200,100,200,100,400]);
    const k = timer.key; Object.assign(timer, { segs:[], i:0, key:null });
    setDone(k, true); return;
  }
  timer.left = timer.segs[timer.i][1]; timer.end = Date.now() + timer.left*1000;
  beep(880); setTimeout(() => beep(880), 220); vibrate([150,80,150]);
}
function tick(){
  timer.left = (timer.end - Date.now())/1000;
  if (timer.left <= 0) { nextSeg(); if (tab === 'train') render(); return; }
  if (tab === 'train') tickUI();
}
function tickUI(){
  const c = $('#tClock'); if (!c || !timer.segs.length) return;
  c.textContent = fmt(timer.left); $('#tSeg').textContent = timer.segs[timer.i][0];
  const n = timer.segs[timer.i+1]; $('#tNext').textContent = n ? 'Næste: ' + n[0] : 'Sidste trin 💪';
}
function exTimer(id){ const ex = EX[id]; startRest(ex.time, ex.name); }

/* Sæt og pause */
let restInt = null;
function tapSet(key, id, s, sets){
  const d = day(key); d.sets[id] = d.sets[id] || [];
  d.sets[id][s] = !d.sets[id][s]; save();
  if (d.sets[id][s]) {
    vibrate(40);
    const ids = PROGRAMS[schFor(trainDay).prog], w = weekInfo();
    const allDone = ids.every(x => (d.sets[x]||[]).filter(Boolean).length >= (x==='row'?1:w.sets));
    if (allDone) { setDone(key, true); return; }
    if (id !== 'row') startRest(60, 'Pause');
    if ((d.sets[id]||[]).filter(Boolean).length >= sets) { const nx = ids[ids.indexOf(id)+1]; if (nx) openEx = nx; }
  }
  render();
}
function startRest(sec, label){
  clearInterval(restInt); let end = Date.now() + sec*1000; beep(660,.05);
  const draw = () => { const left = (end - Date.now())/1000;
    if (left <= 0) { clearInterval(restInt); $('#restBox').innerHTML = ''; beep(880); setTimeout(() => beep(1100,.25), 220); vibrate([200,100,200]); toast(label === 'Pause' ? 'Klar til næste sæt 💪' : 'Tid! 👏'); return; }
    $('#restBox').innerHTML = `<div class="rest"><span style="font-size:26px">⏱️</span><div class="t">${label}<div style="opacity:.7;font-size:12px">${label==='Pause' ? 'Træk vejret, drik lidt vand' : 'Hold den!'}</div></div><b>${fmt(left)}</b><button class="btn small gray" onclick="endRest()">Spring over</button></div>`; };
  draw(); restInt = setInterval(draw, 250);
}
function endRest(){ clearInterval(restInt); $('#restBox').innerHTML = ''; }
function setDone(key, v){
  const d = day(key); d.done = v; save();
  if (v) { toast('🎉 Godt gået! Træning gennemført'); vibrate([60,40,60]); endRest(); }
  render();
}

/* ================= UGE ================= */
function renderWeek(){
  const order = [1,2,3,4,5,6,0], g = state.settings, today = iso(new Date()), G0 = goalFor(today);
  let doneCount = 0, kcalSum = 0, kcalDays = 0;
  const cells = order.map((wd,i) => {
    const k = keyForWeekday(wd), dd = state.days[k], t = dd ? totals(k) : { kcal:0, p:0 };
    if (dd && dd.done) doneCount++; if (t.kcal > 0) { kcalSum += t.kcal; kcalDays++; }
    return `<div class="d ${k===today?'today':''}"><b>${SHORT[i]}</b><span class="e">${dd && dd.done ? '✅' : schFor(wd).e}</span><div class="mini"><div style="height:${Math.min(100, t.kcal/goalFor(k).kcal*100)}%;background:${t.kcal>goalFor(k).kcal*1.05?'#e11d48':'#f97316'}"></div></div>${t.kcal ? r0(t.kcal) : '–'}<small class="muted" style="display:block;font-size:10px">/${goalFor(k).kcal}</small><button class="loc" onclick="setWork(${wd},'${workAt(wd)==='home'?'office':'home'}')">${workAt(wd)==='home'?'🏡':'🏢'}</button></div>`;
  }).join('');
  const ws = state.weights.slice(-12);
  $('#view').innerHTML = `
    <div class="card"><h2>📅 Denne uge</h2><div class="wk">${cells}</div>
      <div class="row between" style="margin-top:12px;font-size:14px"><span>💪 Træninger: <b>${doneCount} / 7</b></span><span>🔥 Snit: <b>${kcalDays ? r0(kcalSum/kcalDays) : '–'} kcal</b></span></div>
      <div class="muted" style="margin-top:6px">Tryk 🏢/🏡 for at skifte mellem kontor og hjemme – forslag og mål opdateres.</div></div>

    <div class="card"><h2>⚖️ Vægt</h2>
      <div class="row"><input class="field" id="wIn" type="number" inputmode="decimal" step="0.1" placeholder="fx 64,5" style="margin:0"><button class="btn" onclick="addWeight()">Gem</button></div>
      <div class="muted" style="margin-top:6px">Vej dig 1 gang om ugen, samme tid og dag.</div>
      ${ws.length ? weightChart(ws) : ''}
    </div>

    <div class="card settings"><h2>⚙️ Indstillinger</h2>
      <div class="grid2">
      </div>
      <label>Mål for kalorier og protein</label>
      <div class="wtog"><button class="${g.auto?'on':''}" onclick="setS('auto',true);render()">🤖 Automatisk</button><button class="${!g.auto?'on':''}" onclick="setManual()">✍️ Mine egne</button></div>
      <div class="muted" style="margin:-4px 0 10px">${g.auto ? `I dag: ${G0.kcal} kcal · ${G0.p} g protein. Regnes ud fra vægt (${String(G0.w).replace('.',',')} kg), højde, alder, dagens træning, cyklus og vægtudvikling – aldrig under dit hvilestofskifte (${G0.bmr} kcal).` : `Dine egne mål bruges hver dag. Automatisk ville i dag være ${G0.autoK} kcal · ${G0.autoP} g.`}</div>
      <div class="grid2">
        <div><label>Kalorie-mål</label><input class="field" type="number" ${g.auto?'disabled':''} value="${g.auto?G0.kcal:g.kcal}" onchange="setS('kcal',+this.value)"></div>
        <div><label>Protein-mål (g)</label><input class="field" type="number" ${g.auto?'disabled':''} value="${g.auto?G0.p:g.protein}" onchange="setS('protein',+this.value)"></div>
        <div><label>Højde (cm)</label><input class="field" type="number" value="${g.height}" onchange="setS('height',+this.value);render()"></div>
        <div><label>Alder</label><input class="field" type="number" value="${g.age}" onchange="setS('age',+this.value);render()"></div>
        <div><label>1. dag i seneste menstruation</label><input class="field" type="date" value="${g.cycleStart}" onchange="setS('cycleStart',this.value);render()"></div>
        <div><label>Cykluslængde (dage)</label><input class="field" type="number" value="${g.cycleLen}" onchange="setS('cycleLen',+this.value);render()"></div>
        <div><label>Start på 4-ugers plan</label><input class="field" type="date" value="${g.programStart}" onchange="setS('programStart',this.value)"></div>
      </div>
      <div class="row" style="flex-wrap:wrap;gap:8px">
        <button class="btn small gray" onclick="exportData()">⬇️ Gem backup</button>
        <button class="btn small gray" onclick="if(confirm('Slet ALT gemt data på denne telefon?')){localStorage.removeItem(KEY);location.reload()}">🗑️ Nulstil</button>
      </div>
      <div class="muted" style="margin-top:8px">Alt gemmes kun på denne telefon. Appen er generel vejledning og erstatter ikke lægens vurdering.</div>
    </div>`;
}
function setS(k, v){ state.settings[k] = v; save(); toast('Gemt'); header(); }
function setManual(){ const G = goalFor(); state.settings.auto = false; state.settings.kcal = G.kcal; state.settings.protein = G.p; save(); toast('Skriv dine egne mål'); render(); }
function addWeight(){ const v = parseFloat(($('#wIn').value||'').replace(',','.')); if (!(v > 30 && v < 200)) { toast('Skriv en gyldig vægt'); return; } state.weights = state.weights.filter(w => w.date !== iso(new Date())); state.weights.push({ date: iso(new Date()), kg: v }); save(); toast('Vægt gemt'); render(); }
function weightChart(ws){
  const W = 300, H = 110, pad = 24, vals = ws.map(w => w.kg), mn = Math.min(...vals, 60) - .5, mx = Math.max(...vals) + .5;
  const x = i => pad + (ws.length === 1 ? (W-2*pad)/2 : i*(W-2*pad)/(ws.length-1)), y = v => 10 + (mx - v)/(mx - mn)*(H-30);
  const pts = ws.map((w,i) => `${x(i)},${y(w.kg)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:10px">
    <line x1="${pad}" x2="${W-pad}" y1="${y(60)}" y2="${y(60)}" stroke="#10b981" stroke-dasharray="4 4"/><text x="${W-pad}" y="${y(60)-4}" font-size="9" text-anchor="end" fill="#10b981">60 kg</text>
    <polyline points="${pts}" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round"/>
    ${ws.map((w,i) => `<circle cx="${x(i)}" cy="${y(w.kg)}" r="3.5" fill="#0f766e"/><text x="${x(i)}" y="${y(w.kg)-7}" font-size="8.5" text-anchor="middle" fill="#334155">${String(w.kg).replace('.',',')}</text><text x="${x(i)}" y="${H-3}" font-size="7.5" text-anchor="middle" fill="#94a3b8">${w.date.slice(8)}/${+w.date.slice(5,7)}</text>`).join('')}
  </svg>`;
}
function exportData(){ const b = new Blob([JSON.stringify(state)], { type:'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'min-uge-backup-' + iso(new Date()) + '.json'; a.click(); }

render();
</script>
</body>
