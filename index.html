<style>
  :root {
    --teal: #0a0a0a; --teal2: #404040; --ink: #0a0a0a; --muted: #737373; --line: #e8e8e8;
    --bg: #f2f2f2; --card: #fff; --orange: #ff5a1f; --red: #e11d48; --blue: #525252; --violet: #262626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 16px; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  input, select { font: inherit; }
  .hidden { display: none !important; }

  header { background: linear-gradient(135deg, var(--teal), var(--teal2)); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 18px 18px; border-radius: 0 0 22px 22px; }
  header .date { font-size: 13px; opacity: .9; text-transform: capitalize; }
  header h1 { margin: 2px 0 0; font-size: 26px; }
  header .sub { font-size: 13px; opacity: .95; margin-top: 4px; }

  main { padding: 14px; max-width: 560px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 18px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(15, 23, 42, .06); }
  .card h2 { font-size: 17px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 20; }
  nav button { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--muted); padding: 4px 0; gap: 2px; }
  nav button .i { font-size: 22px; filter: grayscale(1); opacity: .6; }
  nav button.on { color: var(--teal); font-weight: 600; }
  nav button.on .i { filter: none; opacity: 1; }

  /* Rings */
  .rings { display: grid; grid-template-columns: 130px 1fr; gap: 14px; align-items: center; }
  .ring { position: relative; width: 130px; height: 130px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .c b { font-size: 26px; }
  .ring .c span { font-size: 12px; color: var(--muted); }
  .bar { height: 12px; background: #ededed; border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 99px; transition: width .4s; }
  .stat { margin-bottom: 10px; }
  .stat .row { font-size: 14px; margin-bottom: 4px; }

  /* Chips & buttons */
  .btn { background: var(--teal); color: #fff; border-radius: 14px; padding: 12px 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
  .btn.ghost { background: #f2f2f2; color: var(--teal); }
  .btn.gray { background: #f0f0f0; color: var(--ink); }
  .btn.full { width: 100%; }
  .btn.small { padding: 7px 11px; font-size: 14px; border-radius: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .action { background: #fff; border-radius: 18px; padding: 16px 10px; text-align: center; box-shadow: 0 1px 3px rgba(15,23,42,.06); }
  .action .e { font-size: 30px; display: block; }
  .action b { display: block; margin-top: 4px; font-size: 15px; }
  .action span { font-size: 12px; color: var(--muted); }

  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chk { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 12px; background: #f7f7f7; border: 1px solid var(--line); font-size: 14px; text-align: left; }
  .chk .b { width: 22px; height: 22px; border-radius: 7px; border: 2px solid #d4d4d4; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; flex: none; }
  .chk.on { background: #f2f2f2; border-color: #d4d4d4; }
  .chk.on .b { background: var(--teal); border-color: var(--teal); }
  .water { display: flex; gap: 6px; flex-wrap: wrap; }
  .water button { font-size: 24px; opacity: .25; }
  .water button.on { opacity: 1; }

  /* Food list */
  .entry { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #f0f0f0; }
  .entry:last-child { border-bottom: none; }
  .thumb { width: 48px; height: 48px; border-radius: 12px; background: #f2f2f2; display: flex; align-items: center; justify-content: center; font-size: 24px; flex: none; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .entry .t { flex: 1; min-width: 0; }
  .entry .t b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry .k { text-align: right; font-size: 14px; font-weight: 600; }
  .entry .k span { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  .scanbox { position: relative; border-radius: 16px; overflow: hidden; background: #0a0a0a; aspect-ratio: 4/3; margin-bottom: 10px; }
  .scanbox video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scanbox i { position: absolute; left: 12%; right: 12%; top: 50%; height: 2px; background: #f43f5e; box-shadow: 0 0 10px #f43f5e; }
  .chipm { background:#f0f0f0; border-radius:99px; padding:4px 10px; }
  .actg { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .actg button { background:#f0f0f0; border-radius:14px; padding:10px 4px; font-size:13px; } .actg button span { display:block; font-size:26px; }
  .actg button.on { background:#f0f0f0; outline:2px solid #0a0a0a; }
  .adj { margin-top:10px; font-size:13px; background: rgba(255,255,255,.75); border-radius: 12px; padding: 8px 10px; }
  .lg { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:#f7f7f7; border-radius:12px; padding:8px 10px; margin-top:8px; font-size:14px; }
  .lg .st { display:flex; align-items:center; gap:4px; } .lg .st button { width:32px; height:32px; border-radius:99px; background:#e8e8e8; font-size:18px; } .lg .st b { min-width:34px; text-align:center; font-size:17px; }
  .lg .kg button { padding:4px 9px; border-radius:99px; background:#e8e8e8; font-size:12px; margin-right:3px; } .lg .kg button.on { background:#0a0a0a; color:#fff; }
  .mw .d span { display:block; font-size:16px; line-height:1.3; }
  .scale { display:flex; gap:4px; margin:4px 0 10px; } .scale button { flex:1; font-size:22px; padding:6px 0; border-radius:12px; background:#f0f0f0; filter:grayscale(.7); opacity:.7; }
  .scale button.on { background:#f0f0f0; filter:none; opacity:1; outline:2px solid #0a0a0a; }
  .del { color: #a3a3a3; font-size: 18px; padding: 4px; }
  .star { font-size: 18px; padding: 4px; color: #d4d4d4; } .star.on { color: #f59e0b; }

  /* Sheet */
  .backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 40; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto; background: #fff; border-radius: 22px 22px 0 0; z-index: 41; padding: 10px 16px calc(18px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  .sheet .grab { width: 40px; height: 5px; border-radius: 9px; background: #d4d4d4; margin: 0 auto 10px; }
  .sheet h3 { margin: 0 0 10px; font-size: 19px; }
  .hero { position: relative; }
  .swapbtn { position: absolute; top: 14px; right: 14px; background: rgba(255,255,255,.85); color: #0a0a0a; }
  .wtog { display:flex; gap:6px; background:#f0f0f0; border-radius:99px; padding:4px; margin-bottom:12px; }
  .wtog button { flex:1; border:0; border-radius:99px; padding:9px 6px; font-weight:700; font-size:14px; background:transparent; color:#525252; }
  .wtog button.on { background:#fff; color:#0a0a0a; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  .why { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .why span { background:#fff; border-radius:99px; padding:4px 10px; font-size:12px; border:1px solid #e8e8e8; }
  .wk .loc { display:block; border:0; background:#f0f0f0; border-radius:8px; margin-top:4px; padding:2px 0; font-size:14px; width:100%; }
  .moved { margin-top: 8px; font-size: 12px; background: rgba(255,255,255,.6); border-radius: 99px; padding: 4px 10px; display: inline-block; }
  .days button { position: relative; } .days .sw { position: absolute; top: 2px; right: 4px; font-style: normal; font-size: 10px; color: #262626; }
  .sh { margin: 14px 0 8px; font-size: 14px; color: #525252; }
  .opt.sel { border-color: var(--teal); background: #fafafa; }
  .shead { display: flex; align-items: center; justify-content: space-between; gap: 10px; } .shead h3 { margin: 0 0 10px; } .shead .btn { margin-bottom: 10px; }
  .added { background: #f2f2f2; border-radius: 14px; padding: 10px; margin-bottom: 10px; }
  .added .sum { font-size: 14px; margin-bottom: 6px; } .added .sum b { color: var(--orange); }
  .added .chip { display: inline-flex; align-items: center; gap: 4px; background: #fff; border: 1px solid #d4d4d4; border-radius: 99px; padding: 4px 4px 4px 10px; margin: 0 4px 4px 0; font-size: 13px; }
  .added .chip button { border: 0; background: #f0f0f0; border-radius: 99px; width: 22px; height: 22px; font-size: 11px; color: #737373; }
  .tabs { display: flex; background: #f0f0f0; border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 8px 4px; border-radius: 10px; font-size: 14px; color: var(--muted); }
  .tabs button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .opt { display: flex; align-items: center; gap: 10px; padding: 11px 10px; border-radius: 12px; width: 100%; text-align: left; border: 1px solid var(--line); margin-bottom: 7px; background: #fff; }
  .opt .e { font-size: 24px; }
  .opt .t { flex: 1; }
  .opt .t b { display: block; font-size: 15px; }
  .opt .t span { font-size: 12px; color: var(--muted); }
  .opt .plus { width: 30px; height: 30px; border-radius: 50%; background: var(--teal); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .field { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: #f7f7f7; margin-bottom: 10px; }
  .photo-prev { width: 100%; max-height: 220px; object-fit: cover; border-radius: 14px; margin-bottom: 10px; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 10px 0; }
  .stepper button { width: 44px; height: 44px; border-radius: 50%; background: #f0f0f0; font-size: 22px; font-weight: 600; }
  .stepper input { width: 90px; text-align: center; font-size: 22px; font-weight: 700; border: none; border-bottom: 2px solid var(--line); padding: 4px; background: transparent; }
  .parse { margin: -2px 0 10px; }
  .pl { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: #f2f2f2; margin-bottom: 6px; font-size: 14px; }
  .pl .e { font-size: 22px; } .pl .t { flex: 1; } .pl .v { text-align: right; white-space: nowrap; color: var(--orange); font-weight: 600; }
  .pl .v small { color: #737373; font-weight: 500; }
  .pl.unk { background: #f2f2f2; } .pl.tot { background: #ececec; }
  textarea.field { resize: none; font: inherit; }
  .lbl { font-size: 12px; color: #737373; } .lbl .field { margin-top: 4px; font-size: 16px; color: inherit; }
  .calc { text-align: center; font-size: 15px; margin-bottom: 12px; }
  .calc b { font-size: 22px; color: var(--orange); }

  /* Training */
  .days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; }
  .days button { flex: 1; min-width: 44px; padding: 8px 0; border-radius: 12px; background: #fff; font-size: 13px; font-weight: 600; color: var(--muted); position: relative; }
  .days button.on { background: var(--teal); color: #fff; }
  .days button.today::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--orange); }
  .days button .ok { display: block; font-size: 11px; }
  .hero { border-radius: 18px; padding: 16px; margin-bottom: 12px; color: #0a0a0a; }
  .hero .big { font-size: 40px; }
  .hero h2 { margin: 4px 0 2px; font-size: 22px; }
  .hero { background:#0a0a0a; color:#fff; } .t-rest { background:#262626; }
  .ex { background: #fff; border-radius: 16px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(15,23,42,.06); overflow: hidden; }
  .ex .top { display: flex; align-items: center; gap: 10px; padding: 12px; width: 100%; text-align: left; }
  .ex .num { width: 30px; height: 30px; border-radius: 50%; background: var(--red); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
  .ex.B .num { background: var(--blue); }
  .ex.done .num { background: var(--teal); }
  .ex .top .t { flex: 1; }
  .ex .top .t b { display: block; font-size: 16px; }
  .ex .top .t span { font-size: 13px; color: var(--muted); }
  .ex .chev { color: #a3a3a3; transition: transform .2s; }
  .ex.open .chev { transform: rotate(90deg); }
  .ex .body { padding: 0 12px 12px; }
  .fig { background: linear-gradient(#f7f7f7, #f2f2f2); border-radius: 14px; margin-bottom: 10px; }
  .fig svg { width: 100%; height: auto; display: block; }
  .ex ul { margin: 0 0 10px 18px; padding: 0; font-size: 14px; }
  .ex li { margin-bottom: 3px; }
  .sets { display: flex; gap: 8px; align-items: center; padding: 0 12px 12px 52px; }
  .set { width: 42px; height: 42px; border-radius: 50%; border: 2px dashed #d4d4d4; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); font-size: 14px; }
  .set.on { background: var(--teal); border: 2px solid var(--teal); color: #fff; }
  .sets .lbl { font-size: 12px; color: var(--muted); margin-left: 4px; }

  /* Timer */
  .timer { text-align: center; }
  .timer .seg { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .timer .clock { font-size: 56px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .timer .next { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .segs { display: flex; gap: 2px; height: 10px; margin: 10px 0 14px; border-radius: 99px; overflow: hidden; }
  .segs div { height: 100%; }
  .rest { position: fixed; left: 12px; right: 12px; bottom: calc(84px + env(safe-area-inset-bottom)); background: #0a0a0a; color: #fff; border-radius: 18px; padding: 12px 16px; z-index: 30; display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: 536px; margin: 0 auto; }
  .rest b { font-size: 28px; font-variant-numeric: tabular-nums; }
  .rest .t { flex: 1; font-size: 14px; }
  .toast { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: #0a0a0a; color: #fff; padding: 10px 16px; border-radius: 99px; font-size: 14px; z-index: 60; box-shadow: 0 6px 18px rgba(0,0,0,.2); white-space: nowrap; }

  /* Week */
  .wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .wk .d { background: #f7f7f7; border-radius: 12px; padding: 7px 2px; text-align: center; font-size: 12px; border: 1px solid var(--line); }
  .wk .d.today { border-color: var(--teal); border-width: 2px; }
  .wk .d b { display: block; font-size: 13px; }
  .wk .d .e { font-size: 18px; display: block; margin: 3px 0; }
  .wk .mini { height: 40px; width: 12px; margin: 4px auto 2px; background: #ededed; border-radius: 6px; position: relative; overflow: hidden; }
  .wk .mini div { position: absolute; bottom: 0; left: 0; right: 0; background: var(--orange); border-radius: 6px; }
  .phase { border-radius: 14px; padding: 12px; font-size: 14px; }
  .settings label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }

  /* ===== Monokromt design ===== */
  :root { --teal:#0a0a0a; --ink:#0a0a0a; --muted:#737373; --line:#ececec; --bg:#f2f2f2; --orange:#ff5a1f; --red:#e11d48; }
  html, body { font-family: -apple-system, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
  header { background: var(--bg); color: var(--ink); border-radius: 0; padding: calc(10px + env(safe-area-inset-top)) 18px 6px; }
  header .htop { display:flex; align-items:flex-start; justify-content:space-between; }

  header .sub span { background:#fff; border:1px solid var(--line); border-radius:99px; padding:4px 10px; font-size:12px; font-weight:500; }
  .gear { width:40px; height:40px; border-radius:99px; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; margin-top:4px; }
  .gear svg { width:20px; height:20px; }
  main { padding: 8px 14px 14px; }
  .card { border-radius: 20px; box-shadow: none; border: 1px solid var(--line); padding: 16px; }
  .card h2 { font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
  .btn { background: #0a0a0a; border-radius: 99px; font-weight: 600; }
  .btn.ghost, .btn.gray { background: #f0f0f0; color: #0a0a0a; }
  .btn.small { border-radius: 99px; padding: 8px 13px; }
  .action { box-shadow:none; border:1px solid var(--line); border-radius:20px; }
  .bar { height: 8px; background: #ededed; }
  nav { grid-template-columns: repeat(5, 1fr); background: rgba(255,255,255,.92); border-top: 1px solid var(--line); align-items: end; }
  nav button { color: #a3a3a3; font-weight: 500; font-size: 10.5px; gap: 3px; }
  nav button svg.i { width: 24px; height: 24px; }

  .ex { box-shadow:none; border:1px solid var(--line); border-radius: 20px; }

  .ex.done .num { background:#0a0a0a; color:#fff; }
  .set { border-color:#d4d4d4; }
  .chk { background:#fff; border-color: var(--line); }
  .chk.on { background:#f5f5f5; border-color:#0a0a0a; }
  .scale button { filter: grayscale(1); opacity:.6; background:#f5f5f5; }
  .scale button.on { outline-color:#0a0a0a; background:#fff; }
  .opt { border-color: var(--line); border-radius: 16px; }

  .days button.on { background:#0a0a0a; border-color:#0a0a0a; }
  .wk .d { background:#fff; }
  .wk .d.today { border-color:#0a0a0a; }
  .toast { display:flex; align-items:center; gap:12px; }
  .toast button { color:#ff8a5c; font-weight:700; }
  .why span { border-color: var(--line); }
  .sheet { border-radius: 26px 26px 0 0; }
  .actg.quick { grid-template-columns: repeat(3,1fr); }

  /* Fremgang */
  .statc { display:grid; grid-template-columns: 92px 1fr; gap:16px; align-items:center; }

let MATCHERS = [];
function loadLearned(){ (state.learned || []).forEach(f => { if (!FOOD_DB.some(x => x[0] === f[0])) FOOD_DB.push(f); ALIAS[f[0]] = f[6]; if (f[7]) MACRO[f[0]] = f[7]; }); buildMatchers(); }
function buildMatchers(){
  MATCHERS = [];
  FOOD_DB.forEach(f => (ALIAS[f[0]] || f[0].toLowerCase().split(/[ ,/(]/)[0]).split('|').forEach(a => {
    a = a.trim(); if (!a) return;
    const tail = a.length >= 4 ? '[a-zæøåéü]*' : '(?![a-zæøåéü])';
    MATCHERS.push({ f, len: a.length, re: new RegExp('(^|[^a-zæøåéü0-9])(' + a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + tail + ')', 'g') });
  }));
  MATCHERS.sort((x, y) => y.len - x.len);
}

function parseQty(txt){
  // finder sidste tal + enhed i et stykke tekst
  const toks = txt.toLowerCase().replace(/(\d)([a-zæøå½])/g, '$1 $2').replace(/(\d),(\d)/g, '$1.$2').split(/\s+/).filter(Boolean);
  let num = null, unit = null;
  for (let i = 0; i < toks.length; i++) {
    let t = toks[i], n = null;
    const m = t.match(/^(\d+(?:\.\d+)?)(½)?$/);
    if (m) n = +m[1] + (m[2] ? .5 : 0);
    else if (t === 'et' && toks[i+1] === 'par') { n = 2; i++; }
    else if (t in NUMW) n = NUMW[t];
    if (n !== null) { num = (t === 'halv' || t === 'halvt' || t === 'halve') && num ? num * .5 : n; unit = null;
      const nx = toks[i+1]; if (nx) { const u = UNITS.find(([re]) => re.test(nx)); if (u) { unit = u[1]; i++; } } continue; }
    const u = UNITS.find(([re]) => re.test(t)); if (u && num === null) { num = 1; unit = u[1]; }
  }
  return { num, unit };
}
function gramsFor(f, q){
  const portion = f[4], piece = PIECE[f[0]];
  if (q.num === null) return portion;
  if (typeof q.unit === 'number') return q.num * q.unit;
  if (q.unit === 'hand') return q.num * (/håndfuld/.test(f[5]) ? portion : 30);
  if (q.unit === 'n') return q.num * (piece || portion);
  if (q.num >= 20) return q.num;              // "150 kylling" = gram
  return q.num * (piece || portion);
}
function parseMeal(text){
  const items = [], unknown = [];
  let prevSep = '';
  text.split(/(\n|,(?!\d)|;|\+|\.(?!\d)|\bog\b|\bmed\b|\bsamt\b|\bplus\b)/i).forEach((seg, si) => {
    if (si % 2) { prevSep = seg.toLowerCase(); return; }
    const s = seg.toLowerCase(); if (!s.trim()) return;
    const hits = [], used = new Array(s.length).fill(false);
    MATCHERS.forEach(m => { m.re.lastIndex = 0; let r;
      while ((r = m.re.exec(s))) { const st = r.index + r[1].length, en = st + r[2].length;
        if (used.slice(st, en).some(Boolean) || hits.some(h => h.f === m.f)) continue;
        used.fill(true, st, en); hits.push({ f: m.f, st, en }); } });
    if (!hits.length) {
      const rest = s.replace(/\d+([.,]\d+)?/g, ' ').replace(STOP, ' ').split(/\s+/).filter(w => w && !UNITS.some(([re]) => re.test(w)) && !(w in NUMW)).join(' ').trim();
      if (rest.length >= 2) unknown.push({ q: rest, qty: parseQty(s) });
      return;
    }
    hits.sort((a, b) => a.st - b.st);
    hits.forEach((h, i) => {
      const before = s.slice(i ? hits[i-1].en : 0, h.st), after = s.slice(h.en, i < hits.length-1 ? hits[i+1].st : s.length);
      let q = parseQty(before); if (q.num === null && i === hits.length-1) q = parseQty(after);
      let g = gramsFor(h.f, q);
      if (prevSep === 'med' && /mælk/i.test(h.f[0]) && typeof q.unit !== 'number') g = (q.num || 1) * 50;   // mælk i kaffe/te
      items.push({ f: h.f, g, kcal: h.f[2]*g/100, p: h.f[3]*g/100 });
    });
  });
  return { items, unknown };
}

function fmtG(g){ return g >= 1000 ? (g/1000).toFixed(1).replace('.',',') + ' kg' : r0(g) + ' g'; }
function cParse(){
  const box = $('#cParse'); if (!box) return;
  const { items, unknown } = parseMeal($('#cName').value);
  const kcal = items.reduce((a, x) => a + x.kcal, 0), p = items.reduce((a, x) => a + x.p, 0);
  box.innerHTML = items.map(x => `<div class="pl"><span class="e">${x.f[1]}</span><span class="t"><b>${esc(x.f[0])}</b> · ${fmtG(x.g)}</span><span class="v">${r0(x.kcal)} kcal<br><small>${x.p.toFixed(1).replace('.',',')} g prot.</small></span></div>`).join('')
    + unknown.map((u, i) => `<div class="pl unk"><span class="e">❓</span><span class="t"><b>"${esc(u.q)}"</b> kender jeg ikke</span>
        <button class="btn small" onclick="lookup(${i})" ${lookupBusy[u.q] ? 'disabled' : ''}>${lookupBusy[u.q] ? 'Søger…' : '🔎 Slå op'}</button></div>`).join('')

  cParse.last = { items, unknown };

}

}
async function lookup(i){
  const u = cParse.last.unknown[i]; if (!u) return; const q = u.q;
  lookupBusy[q] = true; cParse();
  try {
    const r = await fetch('https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=20&fields=product_name,nutriments&search_terms=' + encodeURIComponent(q));
    const d = await r.json();
    const hit = (d.products || []).find(x => x.product_name && x.nutriments && x.nutriments['energy-kcal_100g'] > 0 && x.nutriments.proteins_100g != null);
    if (!hit) { toast('Fandt ikke "' + q + '" – skriv tallene selv'); }
    else {
      const name = hit.product_name.trim().slice(0, 40), f = [name, '🌐', Math.round(hit.nutriments['energy-kcal_100g']), Math.round(hit.nutriments.proteins_100g*10)/10, 100, '100 g', q];
      f[7] = [hit.nutriments.carbohydrates_100g, hit.nutriments.fat_100g, hit.nutriments.fiber_100g].map(v => Math.round((+v||0)*10)/10); MACRO[name] = f[7];

      FOOD_DB.push(f); ALIAS[name] = q; buildMatchers();
      toast(`🌐 ${name}: ${f[2]} kcal / 100 g – husket`);
    }
  } catch (e) { toast('Ingen forbindelse – skriv tallene selv'); }
  delete lookupBusy[q]; cParse();
}

function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ toast('Hukommelsen er fuld – slet nogle billeder'); } }
function iso(d){ return d.toLocaleDateString('sv-SE'); }
function mondayOf(d){ const x = new Date(d); const w = (x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(12,0,0,0); return x; }
function day(k = iso(new Date())){ return state.days[k] || (state.days[k] = { food:[], sets:{}, done:false, checks:{}, water:0 }); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function r0(n){ return Math.round(n); }
function totals(k){ const d = day(k); return d.food.reduce((a,f) => ({ kcal:a.kcal+f.kcal, p:a.p+f.p, c:a.c+(f.c||0), fat:a.fat+(f.fat||0), fib:a.fib+(f.fib||0), miss:a.miss+(f.c==null?1:0) }), { kcal:0, p:0, c:0, fat:0, fib:0, miss:0 }); }
function weekInfo(){
  const start = new Date(state.settings.programStart + 'T12:00:00');
  const diff = Math.floor((mondayOf(new Date()) - mondayOf(start)) / (7*864e5));
  return WEEKS[((diff % 4) + 4) % 4];
}
function cycLen(){
  const ps = state.periods.slice().sort(), ds = [];
  for (let i = 1; i < ps.length; i++) { const d = Math.round((new Date(ps[i]+'T12:00:00') - new Date(ps[i-1]+'T12:00:00')) / 864e5); if (d >= 18 && d <= 45) ds.push(d); }
  return ds.length ? { len: Math.round(ds.slice(-6).reduce((a,b) => a+b, 0) / ds.slice(-6).length), n: ds.slice(-6).length } : { len: +state.settings.cycleLen || 28, n: 0 };
}
function lastPeriod(k = iso(new Date())){ const ps = state.periods.filter(p => p <= k).sort(); return ps[ps.length-1] || null; }
function nextPeriod(){
  const cs = lastPeriod(); if (!cs) return null;
  const len = cycLen().len, t = new Date(iso(new Date())+'T12:00:00'); let n = new Date(cs+'T12:00:00');
  while (n <= t) n.setDate(n.getDate() + len);
  const days = Math.round((n - t) / 864e5), ov = new Date(n); ov.setDate(ov.getDate() - 14);
  return { date: n, days, ov, late: Math.round((t - new Date(cs+'T12:00:00')) / 864e5) >= len };
}
function dk(d, o = { weekday:'short', day:'numeric', month:'short' }){ return d.toLocaleDateString('da-DK', o); }
function setPeriod(v){
  if (!v) return; const t = new Date(v+'T12:00:00');
  state.periods = state.periods.filter(p => Math.abs(new Date(p+'T12:00:00') - t) > 10*864e5); state.periods.push(v); state.periods.sort();
  state.settings.cycleStart = state.periods[state.periods.length-1]; save();
}
function logPeriodToday(){ setPeriod(iso(new Date())); closeSheet(); const n = nextPeriod(); toast(`🩸 Registreret · næste ca. ${dk(n.date)}`); render(); }
function cyclePhase(k = iso(new Date())){
  const cs = lastPeriod(k); if (!cs) return null;
  const len = cycLen().len;
  const diff = Math.floor((new Date(k+'T12:00:00') - new Date(cs+'T12:00:00')) / 864e5);
  if (diff < 0) return null;
  const d = (diff % len) + 1;
  if (d <= 5) return { d, name:'Menstruation', e:'🩸', c:'#fff', tip:'Let til moderat træning. Spis jernrigt (æg, bønner, linser, kød) med C-vitamin. Spring intervaller over, hvis du er træt.' };
  if (d <= 13) return { d, name:'Follikelfase', e:'⚡', c:'#fff', tip:'Fuld plan – bedste tid til intervaller og til at gøre øvelserne sværere.' };
  if (d <= 16) return { d, name:'Ægløsning', e:'🌟', c:'#fff', tip:'Fuld plan. Varm godt op.' };
  return { d, name:'Lutealfase', e:'🌙', c:'#fff', tip:'Mere appetit er normalt – læg 100–150 kcal oveni, fx skyr. Lidt mindre kondition er ok.' };
}

      <div class="stat"><div class="row between"><span>💪 ${r0(t.p)} af ${g.protein} g protein</span><b>${r0(Math.max(0,g.protein - t.p))} g mangler</b></div><div class="bar"><div style="width:${Math.min(100,t.p/g.protein*100)}%;background:#0a0a0a"></div></div></div>

    </div>
    <div class="grid2" style="margin-bottom:12px">
      <button class="action" onclick="snap()"><span class="e">📷</span><b>Tag billede</b><span>og vælg hvad det er</span></button>
      <button class="action" onclick="openAdd('plan')"><span class="e">⚡</span><b>Fra min plan</b><span>ét tryk</span></button>
      <button class="action" onclick="openAdd('search')"><span class="e">🔎</span><b>Søg mad</b><span>vælg gram</span></button>
      <button class="action" onclick="openAdd('custom')"><span class="e">✏️</span><b>Skriv selv</b><span>vi regner kcal ud</span></button>

    </div>
    <div class="card">
      <h2>📝 I dag</h2>
      ${list.length ? list.map(f => `
        <div class="entry">
          <div class="thumb">${f.photo ? `<img src="${f.photo}">` : esc(f.e || '🍽️')}</div>
          <div class="t"><b>${esc(f.name)}</b><span class="muted">${esc(f.time)}${f.g ? ' · ' + f.g + ' g' : ''}</span></div>
          <div class="k">${r0(f.kcal)} kcal<span>${r0(f.p)} g protein</span></div>
          <button class="star ${isFav(f.name)?'on':''}" onclick="toggleFav('${f.id}')" aria-label="Favorit">★</button>
          <button class="del" onclick="delFood('${f.id}')">✕</button>
        </div>`).join('') : '<div class="muted">Intet logget endnu. Start med din kefir-skål ☀️</div>'}
      <div class="row" style="flex-wrap:wrap;gap:8px;margin-top:10px">
        ${yesterdayFood().length ? `<button class="btn small gray" onclick="copyYesterday()">📋 Kopiér i går (${yesterdayFood().length})</button>` : ''}
        ${list.length > 1 ? `<button class="btn small gray" onclick="saveMeal(day().food)">💾 Gem dagen som måltid</button>` : ''}
      </div>
      <div class="muted" style="margin-top:6px">Tryk ★ for at gemme en ret som favorit.</div>
    </div>`;
}
function delFood(id){ const d = day(), i = d.food.findIndex(f => f.id === id); if (i < 0) return; const [f] = d.food.splice(i, 1); save(); render();
  toast(`${f.name} slettet`, () => { d.food.splice(i, 0, f); save(); render(); }); }
function addFood(item){
  const d = day();
  d.food.push(Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), time: new Date().toLocaleTimeString('da-DK', { hour:'2-digit', minute:'2-digit' }) }, item, pendingPhoto ? { photo: pendingPhoto } : {}));
  pendingPhoto = null; save(); render();
  toast(`${item.e || '✓'} ${r0(item.kcal)} kcal tilføjet`);
  if ($('#overlay .sheet')) { added.push(d.food[d.food.length-1]); picked = null; drawSheet(true); } else closeSheet();
}
/* Makroer */
function macroBlock(t){
  const kc = t.c*4 + t.fat*9 + t.p*4 || 1, pct = v => Math.round(v/kc*100);
  return `<div class="stat"><div class="row between"><span>🌾 ${r0(t.fib)} af 25 g fibre</span><b>${t.fib >= 25 ? '✓' : r0(25 - t.fib) + ' g mangler'}</b></div><div class="bar"><div style="width:${Math.min(100,t.fib/25*100)}%;background:#525252"></div></div></div>
    <div class="row" style="gap:6px;flex-wrap:wrap;font-size:13px">
      <span class="chipm">🍞 Kulhydrat <b>${r0(t.c)} g</b> · ${pct(t.c*4)}%</span>
      <span class="chipm">🥑 Fedt <b>${r0(t.fat)} g</b> · ${pct(t.fat*9)}%</span>
      <span class="chipm">💪 Protein ${pct(t.p*4)}%</span></div>
    ${t.miss ? `<div class="muted" style="margin-top:4px;font-size:12px">${t.miss} ting mangler tal for kulhydrat/fedt/fibre (fx egne tal).</div>` : ''}
    ${t.kcal > 300 && t.fat*9/kc > .4 ? `<div style="font-size:13px;margin-top:6px">💡 Meget fedt i dag – vælg magert protein og mere grønt til næste måltid.</div>` : ''}`;
}

/* Stregkode */
function macrosFor(name, g){ const m = MACRO[name]; return m ? { c: m[0]*g/100, fat: m[1]*g/100, fib: m[2]*g/100 } : {}; }
function loadScanned(){ Object.values(state.scanned || {}).forEach(x => { if (!FOOD_DB.some(f => f[0] === x.r[0])) FOOD_DB.push(x.r); if (x.m) MACRO[x.r[0]] = x.m; }); }
let scanCtl = null, scanStream = null, scanInt = null, scanBusy = false;
function openScan(){
  $('#overlay').innerHTML = `<div class="backdrop" onclick="closeSheet()"></div>
    <div class="sheet"><div class="grab"></div>
      <div class="shead"><h3>📦 Scan stregkode</h3><button class="btn small gray" onclick="closeSheet()">Luk</button></div>
      <div class="scanbox"><video id="scanV" playsinline muted autoplay></video><i></i></div>
      <div class="muted" id="scanMsg" style="margin-bottom:10px">Starter kameraet… Hold stregkoden vandret i midten.</div>
      <div class="row"><input class="field" id="scanIn" inputmode="numeric" placeholder="Eller skriv tallene under stregkoden" style="margin:0"><button class="btn" onclick="gotCode($('#scanIn').value)">Slå op</button></div>
    </div>`;
  startScan();
}
async function startScan(){
  const v = $('#scanV'), msg = t => { const m = $('#scanMsg'); if (m) m.textContent = t; };
  scanBusy = false;
  try {
    if ('BarcodeDetector' in window) {
      const det = new BarcodeDetector({ formats: ['ean_13','ean_8','upc_a','upc_e'] });
      scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      if (!$('#scanV')) return stopScan();
      v.srcObject = scanStream; await v.play();
      scanInt = setInterval(async () => { try { const r = await det.detect(v); if (r.length) gotCode(r[0].rawValue); } catch(e){} }, 250);
    } else {
      const { BrowserMultiFormatReader } = await import('https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/+esm');
      if (!$('#scanV')) return;
      scanCtl = await new BrowserMultiFormatReader().decodeFromConstraints({ video: { facingMode: 'environment' } }, v, (res) => { if (res) gotCode(res.getText()); });
      if (!$('#scanV')) return stopScan();
    }
    msg('Hold stregkoden vandret i midten – den læses automatisk.');
  } catch (e) { msg('Kameraet kunne ikke startes. Giv adgang til kameraet, eller skriv tallene under stregkoden.'); }
}
function stopScan(){ clearInterval(scanInt); scanInt = null; try { scanCtl && scanCtl.stop(); } catch(e){} scanCtl = null; if (scanStream) scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
async function gotCode(code){
  code = String(code || '').replace(/\D/g, ''); if (scanBusy) return;
  if (code.length < 8) { toast('Skriv hele stregkoden (8–13 cifre)'); return; }
  scanBusy = true; vibrate(60); stopScan();
  const m = $('#scanMsg'); if (m) m.textContent = '🔎 Slår ' + code + ' op…';
  let x = state.scanned[code];
  if (!x) try {
    const r = await fetch('https://world.openfoodfacts.org/api/v2/product/' + code + '.json?fields=product_name,product_name_da,brands,nutriments,serving_quantity,serving_size');
    const d = await r.json(), pr = d.product, n = pr && pr.nutriments;
    if (d.status === 1 && n && n['energy-kcal_100g'] != null) {
      const name = ((pr.product_name_da || pr.product_name || 'Vare ' + code).trim() + (pr.brands ? ' (' + pr.brands.split(',')[0].trim() + ')' : '')).slice(0, 50);
      const sq = +pr.serving_quantity, r1 = v => Math.round((+v || 0)*10)/10;
      x = { r: [name, '📦', Math.round(n['energy-kcal_100g']), r1(n.proteins_100g), sq > 0 && sq < 1000 ? Math.round(sq) : 100, sq > 0 && sq < 1000 ? ('1 portion' + (pr.serving_size ? ' – ' + pr.serving_size : '')) : '100 g'],
            m: [r1(n.carbohydrates_100g), r1(n.fat_100g), r1(n.fiber_100g)] };
      state.scanned[code] = x; save();
      if (!FOOD_DB.some(f => f[0] === x.r[0])) FOOD_DB.push(x.r); MACRO[x.r[0]] = x.m;
    }
  } catch (e) { scanBusy = false; if (m) m.textContent = 'Ingen forbindelse. Prøv igen eller brug "Skriv selv".'; return; }
  if (!x) { scanBusy = false; if (m) m.innerHTML = `Varen ${code} findes ikke i Open Food Facts endnu. <a href="#" onclick="openAdd('custom');return false">Skriv den selv ›</a>`; return; }
  addTab = 'search'; searchQ = ''; added = []; sheetPhoto = pendingPhoto; picked = x.r; grams = x.r[4]; drawSheet();
  toast('📦 ' + x.r[0]);
}

/* Favoritter, måltider og seneste */
const FIELDS = ['name','e','g','kcal','p','c','fat','fib'];
function clean(f){ const o = {}; FIELDS.forEach(k => { if (f[k] != null) o[k] = f[k]; }); return o; }
function isFav(name){ return state.favs.some(f => f.name === name); }
function toggleFav(id){ const f = day().food.find(x => x.id === id); if (!f) return;
  if (isFav(f.name)) { state.favs = state.favs.filter(x => x.name !== f.name); toast('Fjernet fra favoritter'); }
  else { state.favs.unshift(clean(f)); toast('⭐ Gemt som favorit'); }
  save(); render(); if ($('#overlay .sheet')) drawSheet(true); }
function unFav(i){ state.favs.splice(i, 1); save(); drawSheet(true); }
function yesterdayFood(){ const y = new Date(); y.setDate(y.getDate()-1); return (state.days[iso(y)] || {}).food || []; }
function addMany(items, label){
  const d = day(), now = new Date().toLocaleTimeString('da-DK', { hour:'2-digit', minute:'2-digit' });
  const news = items.map(f => Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), time: now }, clean(f)));
  d.food.push(...news); save(); render();
  toast(`${label} · ${r0(news.reduce((a,f)=>a+f.kcal,0))} kcal tilføjet`);
  if ($('#overlay .sheet')) { added.push(...news); drawSheet(true); }
}
function copyYesterday(){ const y = yesterdayFood(); if (y.length) addMany(y, '📋 Gårsdagens mad'); }
function saveMeal(items){
  if (!items.length) return;
  const name = prompt('Hvad skal måltidet hedde?', items.length > 3 ? 'Min dag' : 'Mit måltid'); if (!name) return;
  state.meals.unshift({ name: name.trim(), e: items[0].e || '🍽️', items: items.map(clean) }); save(); toast('💾 Måltid gemt under ⭐ Mine');
  if ($('#overlay .sheet')) drawSheet(true); else render();
}
function addMeal(i){ const m = state.meals[i]; addMany(m.items, m.e + ' ' + m.name); }
function delMeal(i){ if (!confirm('Slet måltidet "' + state.meals[i].name + '"?')) return; state.meals.splice(i, 1); save(); drawSheet(true); }
function recentFoods(){
  const m = new Map(), today = iso(new Date());
  Object.keys(state.days).filter(k => k <= today).sort().slice(-21).forEach(k => state.days[k].food.forEach(f => {
    const r = m.get(f.name) || { f, n:0 }; r.n++; r.f = f; m.set(f.name, r); }));
  return [...m.values()].filter(r => !isFav(r.f.name)).sort((a,b) => b.n - a.n).slice(0, 12).map(r => r.f);
}
function favOpt(f, onclick, extra=''){ return `<button class="opt" onclick="${onclick}"><span class="e">${esc(f.e || '🍽️')}</span><span class="t"><b>${esc(f.name)}</b><span>${f.g ? f.g + ' g · ' : ''}${r0(f.kcal)} kcal · ${r0(f.p||0)} g protein</span></span><span class="plus">＋</span></button>${extra}`; }
function favBody(){
  const y = yesterdayFood(), rec = recentFoods();
  let h = y.length ? `<button class="btn full gray" style="margin-bottom:8px" onclick="copyYesterday()">📋 Kopiér gårsdagens mad · ${y.length} ting · ${r0(y.reduce((a,f)=>a+f.kcal,0))} kcal</button>` : '';
  if (state.meals.length) h += `<h4 class="sh">💾 Gemte måltider</h4>` + state.meals.map((m,i) => { const k = m.items.reduce((a,f)=>a+f.kcal,0), p = m.items.reduce((a,f)=>a+(f.p||0),0);
    return `<div class="row" style="gap:6px"><button class="opt" style="flex:1" onclick="addMeal(${i})"><span class="e">${esc(m.e)}</span><span class="t"><b>${esc(m.name)}</b><span>${m.items.length} ting · ${r0(k)} kcal · ${r0(p)} g protein</span></span><span class="plus">＋</span></button><button class="del" onclick="delMeal(${i})">✕</button></div>`; }).join('');
  if (state.favs.length) h += `<h4 class="sh">⭐ Favoritter</h4>` + state.favs.map((f,i) => `<div class="row" style="gap:6px"><div style="flex:1">${favOpt(f, `addFood(clean(state.favs[${i}]))`)}</div><button class="del" onclick="unFav(${i})">✕</button></div>`).join('');
  if (rec.length) h += `<h4 class="sh">🕒 Spiser du tit</h4>` + rec.map((f,i) => favOpt(f, `addFood(clean(recentFoods()[${i}]))`)).join('');
  return h || '<div class="muted">Her kommer dine favoritter, gemte måltider og det du spiser tit. Tryk ★ ved en ret under Mad, eller "💾 Gem som måltid" når du har tilføjet flere ting.</div>';
}
function undoAdd(id){ added = added.filter(f => f.id !== id); delFood(id); drawSheet(true); }

/* Kamera */
let pendingPhoto = null;
function snap(){ $('#cam').value = ''; $('#cam').click(); }
$('#cam').onchange = (e) => {
  const file = e.target.files[0]; if (!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const max = 360, sc = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = img.width*sc; c.height = img.height*sc;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    pendingPhoto = c.toDataURL('image/jpeg', .7); URL.revokeObjectURL(url);
    openAdd('plan');
  };
  img.src = url;
};

/* Tilføj-ark */
let addTab = 'plan', searchQ = '', picked = null, grams = 0, added = [], sheetPhoto = null;
function openAdd(t){ addTab = t || ((state.favs.length || state.meals.length || yesterdayFood().length) ? 'fav' : 'plan'); picked = null; searchQ = ''; added = []; sheetPhoto = pendingPhoto; drawSheet(); }
function closeSheet(){ stopScan(); $('#overlay').innerHTML = ''; }
function cancelSheet(){ stopScan(); pendingPhoto = null; $('#overlay').innerHTML = ''; }
function drawSheet(keepScroll){
  const oldSheet = $('#overlay .sheet'), top = keepScroll && oldSheet ? oldSheet.scrollTop : 0;
  let body = '';
  if (picked) {
    const [name, e, kc, pr, , unit] = picked;
    body = `<button class="btn small gray" onclick="picked=null;drawSheet()">‹ Tilbage</button>
      <div style="text-align:center;font-size:44px;margin-top:6px">${e}</div>
      <h3 style="text-align:center;margin:4px 0 0">${esc(name)}</h3>
      <div class="muted" style="text-align:center">${kc} kcal og ${pr} g protein pr. 100 g · standard: ${unit}</div>
      <div class="stepper"><button onclick="stepG(-1)">−</button><input id="gIn" type="number" inputmode="numeric" value="${grams}" oninput="grams=+this.value||0;calcG()"><button onclick="stepG(1)">+</button></div>
      <div class="muted" style="text-align:center;margin-top:-6px">gram</div>
      <div class="calc" id="gCalc"></div>
      <button class="btn full" onclick="addPicked()">Tilføj</button>`;
  } else if (addTab === 'fav') {
    body = favBody();
  } else if (addTab === 'plan') {
    body = PLAN_FOODS.map((f,i) => `<button class="opt" onclick="addPlan(${i})"><span class="e">${f.e}</span><span class="t"><b>${esc(f.name)}</b><span>${f.kcal} kcal · ${f.p} g protein · ${esc(f.note)}</span></span><span class="plus">＋</span></button>`).join('');
  } else if (addTab === 'search') {
    const q = searchQ.toLowerCase();
    const res = FOOD_DB.filter(f => f[0].toLowerCase().includes(q));
    body = `<input class="field" id="sIn" placeholder="Søg fx kylling, æg, pasta…" value="${esc(searchQ)}" oninput="searchQ=this.value;drawList()">
      <div id="sList">${listHtml(res)}</div>`;
  } else {
    body = customBody();
  }
  $('#overlay').innerHTML = `<div class="backdrop" onclick="cancelSheet()"></div>
    <div class="sheet"><div class="grab"></div>
      ${sheetPhoto ? `<img class="photo-prev" src="${sheetPhoto}"><div class="muted" style="margin:-4px 0 10px">📷 ${pendingPhoto ? 'Billedet gemmes sammen med det første, du vælger.' : 'Billedet er gemt. Vælg gerne flere ting.'}</div>` : ''}
      <div class="shead"><h3>${sheetPhoto ? 'Hvad er på billedet?' : 'Tilføj mad'}</h3><button class="btn small" onclick="closeSheet()">${added.length ? 'Færdig ✓' : 'Luk'}</button></div>
      ${added.length ? `<div class="added"><div class="sum">✓ ${added.length} tilføjet · <b>${r0(added.reduce((a,f)=>a+f.kcal,0))} kcal</b> · ${r0(added.reduce((a,f)=>a+(f.p||0),0))} g protein</div>
        ${added.map(f => `<span class="chip">${f.e || '✓'} ${esc(f.name.length > 22 ? f.name.slice(0,21)+'…' : f.name)}<button onclick="undoAdd('${f.id}')" aria-label="Fortryd">✕</button></span>`).join('')}
        ${added.length > 1 ? `<div><button class="btn small ghost" style="margin-top:6px" onclick="saveMeal(added)">💾 Gem som måltid</button></div>` : ''}</div>` : ''}
      ${picked ? '' : `<div class="tabs">${[['fav','⭐ Mine'],['plan','⚡ Plan'],['search','🔎 Søg'],['custom','✏️ Skriv']].map(([id,l]) => `<button class="${addTab===id?'on':''}" onclick="addTab='${id}';drawSheet()">${l}</button>`).join('')}</div>`}
      ${body}
    </div>`;
  if (picked) calcG();
  if (addTab === 'custom' && !picked) { cManual = false; $('#cName').focus(); }
  if (top) $('#overlay .sheet').scrollTop = top;
  if (addTab === 'search' && !picked && !searchQ) { const i = $('#sIn'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}
function listHtml(res){ return res.length ? res.map(f => `<button class="opt" onclick="pickFood('${esc(f[0])}')"><span class="e">${f[1]}</span><span class="t"><b>${esc(f[0])}</b><span>${f[5]} (${f[4]} g) ≈ ${r0(f[2]*f[4]/100)} kcal · ${(f[3]*f[4]/100).toFixed(1).replace('.',',')} g protein</span></span><span class="plus">›</span></button>`).join('') : '<div class="muted">Ingen match – brug "Skriv selv".</div>'; }
function drawList(){ const q = searchQ.toLowerCase(); $('#sList').innerHTML = listHtml(FOOD_DB.filter(f => f[0].toLowerCase().includes(q))); }
function pickFood(name){ picked = FOOD_DB.find(f => f[0] === name); grams = picked[4]; drawSheet(); }
function stepG(dir){ const st = picked[4] >= 100 ? 25 : 5; grams = Math.max(0, grams + dir*st); $('#gIn').value = grams; calcG(); }
function calcG(){ const [name, , kc, pr] = picked, m = macrosFor(name, grams); $('#gCalc').innerHTML = `<b>${r0(kc*grams/100)} kcal</b> · ${(pr*grams/100).toFixed(1).replace('.',',')} g protein` + (m.c != null ? `<div class="muted" style="font-size:13px">🍞 ${r0(m.c)} g kulh. · 🥑 ${r0(m.fat)} g fedt · 🌾 ${r0(m.fib)} g fibre</div>` : ''); }
function addPicked(){ const [name, e, kc, pr] = picked; addFood(Object.assign({ name, e, g: grams, kcal: kc*grams/100, p: pr*grams/100 }, macrosFor(name, grams))); }
function addPlan(i){ const f = PLAN_FOODS[i]; addFood({ name:f.name, e:f.e, kcal:f.kcal, p:f.p, c:f.c, fat:f.fat, fib:f.fib }); }
function addCustom(){
  const name = $('#cName').value.trim().replace(/\s+/g,' '), kcal = parseFloat($('#cKcal').value), p = parseFloat(($('#cP').value||'0').replace(',','.')) || 0;
  if (!name) { toast('Skriv hvad du spiste'); return; }
  if (!(kcal >= 0)) { toast('Jeg kunne ikke beregne det – skriv kcal selv'); return; }
  const it = (cParse.last && cParse.last.items) || [];
  const mac = (!cManual && it.length && !cParse.last.unknown.length) ? it.reduce((a,x) => { const m = macrosFor(x.f[0], x.g); if (!m.c && m.c !== 0) a.none = true; else { a.c += m.c; a.fat += m.fat; a.fib += m.fib; } return a; }, { c:0, fat:0, fib:0 }) : null;
  addFood(Object.assign({ name: name.length > 70 ? name.slice(0, 68) + '…' : name, e: it.length ? it[0].f[1] : '✏️', kcal, p }, mac && !mac.none ? { c:mac.c, fat:mac.fat, fib:mac.fib } : {}));
}

/* ================= TRÆNING ================= */
function figure(id){
  const ex = EX[id], A = full(ex.A), B = full(ex.B);
  const dur = '2.8s', ks = 'keySplines=".45 0 .55 1;.45 0 .55 1" calcMode="spline" keyTimes="0;.5;1"';
  const an = (attr, a, b) => a === b ? '' : `<animate attributeName="${attr}" values="${a};${b};${a}" dur="${dur}" repeatCount="indefinite" ${ks}/>`;
  const line = (j1, j2, col, w) => `<line x1="${A[j1][0]}" y1="${A[j1][1]}" x2="${A[j2][0]}" y2="${A[j2][1]}" stroke="${col}" stroke-width="${w}" stroke-linecap="round">
      ${an('x1',A[j1][0],B[j1][0])}${an('y1',A[j1][1],B[j1][1])}${an('x2',A[j2][0],B[j2][0])}${an('y2',A[j2][1],B[j2][1])}</line>`;

function hm(m){ return m >= 60 ? `${Math.floor(m/60)} t ${m%60} min` : `${m} min`; }
function statsCard(){
  const w = weekActive(mondayOf(new Date())), st = streak(), goal = 5, pct = Math.min(1, w.n/goal);
  return `<div class="card statc">
    <div class="ringsm">${ring(w.n, goal, '#ff5a1f', 92)}<div class="c"><b>${w.n}</b><span>af ${goal}</span></div></div>
    <div class="nums"><div><b>${hm(w.m)}</b><span>aktiv tid</span></div><div><b>${st ? '🔥 ' + st : '–'}</b><span>${st === 1 ? 'uge i træk' : 'uger i træk'}</span></div>
      <div class="muted" style="grid-column:1/-1">${w.n >= goal ? 'Ugens mål er nået – flot! 🎉' : `${goal - w.n} aktive dage mere for at nå ugens mål. En aktiv dag = træning klaret eller 20+ min ekstra.`}</div></div></div>`;
}
let calOff = 0;
function calendarCard(){
  const now = new Date(), first = new Date(now.getFullYear(), now.getMonth() + calOff, 1, 12), dim = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate(), pad = (first.getDay()+6)%7, today = iso(now);
  let act = 0, min = 0, str = 0, cells = '';
  for (let i = 0; i < pad; i++) cells += '<span></span>';
  for (let n = 1; n <= dim; n++) {
    const k = iso(new Date(first.getFullYear(), first.getMonth(), n, 12)), d = state.days[k], a = isActive(k), x = extrasOf(k).length, ph = cyclePhase(k);
    if (a) act++; min += activeMin(k); if (d && d.done && schForKey(k).type === 'str') str++;
    cells += `<span class="${a ? 'a' : x ? 'x' : ''} ${k===today?'t':''} ${k>today?'f':''}">${n}${ph && ph.d <= 5 ? '<i></i>' : ''}</span>`;
  }
  return `<div class="card"><div class="row between"><h2 style="margin:0">🗓️ ${first.toLocaleDateString('da-DK',{month:'long',year:'numeric'})}</h2>
      <span><button class="btn small gray" onclick="calOff--;render()">‹</button> <button class="btn small gray" ${calOff>=0?'disabled style="opacity:.3"':''} onclick="calOff++;render()">›</button></span></div>
    <div class="cal">${SHORT.map(x => `<b>${x[0]}</b>`).join('')}${cells}</div>
    <div class="legend"><span><i class="la"></i>Aktiv dag</span><span><i class="lx"></i>Lidt ekstra</span><span><i class="lp"></i>Menstruation${calOff >= 0 ? ' (beregnet)' : ''}</span></div>
    <div class="nums3"><div><b>${act}</b><span>aktive dage</span></div><div><b>${hm(min)}</b><span>aktiv tid</span></div><div><b>${str}</b><span>styrkepas</span></div></div></div>`;
}
function relDay(k){ const t = iso(new Date()), y = iso(addDays(new Date(), -1)); return k === t ? 'I dag' : k === y ? 'I går' : dk(new Date(k+'T12:00:00')); }
function feedCard(){
  const items = [];
  for (let i = 0; i < 45 && items.length < 8; i++) {
    const k = iso(addDays(new Date(), -i)), d = state.days[k]; if (!d) continue;
    const w = curWeight(k);
    extrasOf(k).slice().reverse().forEach(x => { const a = ACT[x.t] || ACT.other; items.push({ k, e:a.e, n:a.n, sub:`${x.time || ''} · ${x.min} min`, kc: burnOf(x, w) }); });
    if (d.done) { const sch = schForKey(k), m = durOf(k); items.push({ k, e:sch.e, n:sch.title, sub:`Fra planen · ${m} min`, kc: Math.round((MET[sch.type]-1)*w*m/60) }); }
  }
  return `<div class="card"><h2>🏃‍♀️ Seneste aktiviteter</h2>${items.length ? items.slice(0,8).map(x => `<div class="entry"><div class="thumb">${x.e}</div><div class="t"><b>${x.n}</b><span class="muted">${relDay(x.k)} · ${x.sub}</span></div><div class="k">≈ ${x.kc}<span>kcal</span></div></div>`).join('')
    : '<div class="muted">Når du markerer træning som gennemført eller logger ekstra aktivitet, kommer den her.</div>'}</div>`;
}

/* ================= HURTIG LOG (+) ================= */
function openQuick(){
  const n = nextPeriod(), near = n && (n.days <= 4 || n.late);
  $('#overlay').innerHTML = `<div class="backdrop" onclick="closeSheet()"></div>
    <div class="sheet"><div class="grab"></div><div class="shead"><h3>Hvad vil du logge?</h3><button class="btn small gray" onclick="closeSheet()">Luk</button></div>
      <div class="actg quick">
        <button onclick="closeSheet();openAdd()"><span>🍽️</span>Mad</button>
        <button onclick="closeSheet();snap()"><span>📷</span>Foto af mad</button>
        <button onclick="closeSheet();openScan()"><span>📦</span>Stregkode</button>
        <button onclick="openExtra(iso(new Date()))"><span>🚶‍♀️</span>Aktivitet</button>
        <button onclick="openWeight()"><span>⚖️</span>Vægt</button>
        <button onclick="closeSheet();tab='today';render();setTimeout(()=>$('#mood')&&$('#mood').scrollIntoView({behavior:'smooth'}),50)"><span>📓</span>Humør</button>
      </div>
      <button class="opt ${near ? 'sel' : ''}" onclick="logPeriodToday()"><span class="e">🩸</span><span class="t"><b>Menstruation startede i dag</b><span>${n ? `Forventet ${dk(n.date)} · bruges til at beregne næste` : 'Så kan appen beregne din næste'}</span></span><span class="plus">＋</span></button>
    </div>`;
}
function openWeight(){
  $('#overlay').innerHTML = `<div class="backdrop" onclick="closeSheet()"></div>
    <div class="sheet"><div class="grab"></div><div class="shead"><h3>⚖️ Dagens vægt</h3><button class="btn small gray" onclick="closeSheet()">Luk</button></div>
      <input class="field" id="wIn" type="number" inputmode="decimal" step="0.1" placeholder="fx 64,5" style="font-size:22px;text-align:center">
      <button class="btn full" onclick="addWeight();closeSheet()">Gem</button>
      <div class="muted" style="margin-top:8px;text-align:center">Seneste: ${String(curWeight()).replace('.',',')} kg · vej dig samme dag og tid hver uge.</div></div>`;
  setTimeout(() => $('#wIn') && $('#wIn').focus(), 100);
}

/* ================= INDSTILLINGER ================= */
function periodLine(compact){
  const n = nextPeriod(); if (!n) return '';
  const c = cycLen();
  return compact ? `<div class="muted" style="margin-top:6px">${n.late ? '🩸 Menstruationen er forventet nu' : `🩸 Næste menstruation ca. <b>${dk(n.date)}</b> (om ${n.days} ${n.days === 1 ? 'dag' : 'dage'})`} · <a href="#" onclick="logPeriodToday();return false">Startet i dag?</a></div>`
    : `${dk(n.date, { weekday:'short', day:'numeric', month:'short' })} · ${n.late ? 'forventet nu' : `om ${n.days} d.`}`;
}
function srow(label, inner, sub){ return `<label class="srow"><span>${label}${sub ? `<small>${sub}</small>` : ''}</span><span class="sv">${inner}</span></label>`; }
function renderSettings(){
  const g = state.settings, G0 = goalFor(), c = cycLen(), n = nextPeriod(), lb = state.lastBackup, ago = lb ? Math.round((new Date(iso(new Date())+'T12:00:00') - new Date(lb+'T12:00:00'))/864e5) : null;
  const num = (k, v, u, dis, after='') => `<input type="number" inputmode="decimal" ${dis ? 'disabled' : ''} value="${v}" onchange="setS('${k}',+this.value);${after}"><em>${u}</em>`;
  $('#view').innerHTML = `
    <div class="gtitle">Daglige mål</div>
    <div class="group"><div style="padding:10px 12px 0"><div class="wtog" style="margin-bottom:10px"><button class="${g.auto?'on':''}" onclick="setS('auto',true);render()">Automatisk</button><button class="${!g.auto?'on':''}" onclick="setManual()">Mine egne</button></div></div>
      ${srow('Kalorier', num('kcal', g.auto ? G0.kcal : g.kcal, 'kcal', g.auto))}
      ${srow('Protein', num('protein', g.auto ? G0.p : g.protein, 'g', g.auto))}</div>
    <div class="gnote">${g.auto ? `Beregnes hver dag ud fra vægt (${String(G0.w).replace('.',',')} kg), højde, alder, træning, cyklus og vægtudvikling – aldrig under dit hvilestofskifte (${G0.bmr} kcal).` : `Dine egne mål bruges hver dag. Automatisk ville i dag være ${G0.autoK} kcal · ${G0.autoP} g.`}</div>

    <div class="gtitle">Om dig</div>
    <div class="group">${srow('Højde', num('height', g.height, 'cm', false, 'render()'))}${srow('Alder', num('age', g.age, 'år', false, 'render()'))}
      <div class="srow" onclick="openWeight()"><span>Vægt</span><span class="sv"><b>${String(curWeight()).replace('.',',')}</b><em>kg ›</em></span></div></div>

    <div class="gtitle">Menstruation</div>
    <div class="group">
      ${srow('Seneste startede', `<input type="date" value="${lastPeriod() || ''}" max="${iso(new Date())}" onchange="setPeriod(this.value);toast('Gemt');render()">`)}
      ${srow('Cykluslængde', c.n ? `<b>${c.len}</b><em>dage</em>` : num('cycleLen', g.cycleLen, 'dage', false, 'render()'), c.n ? `Beregnet ud fra dine ${c.n + 1} seneste` : 'Bliver beregnet, når du har registreret 2+')}
      <div class="srow"><span>Næste menstruation</span><span class="sv"><b>${n ? periodLine(false) : '–'}</b></span></div>
      ${n ? `<div class="srow"><span>Ægløsning ca.</span><span class="sv">${dk(n.ov)}</span></div>` : ''}
      <button class="srow act" onclick="logPeriodToday()">🩸 Den startede i dag</button></div>
    <div class="gnote">Tip: tryk <b>+</b> → 🩸 hver gang, den starter. Så bliver beregningen mere præcis over tid.</div>

    <div class="gtitle">Træningsplan</div>
    <div class="group">${srow('Start på 4-ugers plan', `<input type="date" value="${g.programStart}" onchange="setS('programStart',this.value);render()">`, `Du er i uge ${weekInfo().n}`)}</div>

    <div class="gtitle">Dine data</div>
    <div class="group">
      <div class="srow"><span>Seneste backup</span><span class="sv" style="color:${ago == null || ago > 14 ? '#e11d48' : '#737373'}">${ago == null ? 'Aldrig' : ago === 0 ? 'I dag' : `${ago} dage siden`}</span></div>
      <button class="srow act" onclick="exportData()">⬇️ Gem backup <small>Gem filen i Filer / iCloud</small></button>
      <button class="srow act" onclick="$('#restoreIn').click()">⬆️ Gendan fra backup</button>
      <button class="srow act red" onclick="if(confirm('Slet ALT gemt data på denne telefon? Tag en backup først.')){localStorage.removeItem(KEY);location.reload()}">Slet alle data</button></div>
    <div class="gnote">Alt du taster ind – mad, træning, aktiviteter og indstillinger – gemmes med det samme på telefonen og bliver der, når appen opdateres. Det forsvinder kun, hvis du sletter appen fra hjemmeskærmen eller rydder Safaris data. Tag derfor en backup en gang imellem.</div>
    <div class="gnote" style="margin-bottom:20px">Appen er generel vejledning og erstatter ikke lægens vurdering.</div>`;
}
function backupNag(){
  const n = Object.keys(state.days).length, lb = state.lastBackup, nag = state.backupNag;
  const old = k => !k || (new Date() - new Date(k+'T12:00:00')) / 864e5 > 14;
  if (n < 7 || !old(lb) || (nag && (new Date() - new Date(nag+'T12:00:00')) / 864e5 < 7)) return '';
  return `<div class="card"><div class="row between"><b>💾 Tid til en backup?</b><button class="del" onclick="state.backupNag=iso(new Date());save();render()">✕</button></div>
    <div class="muted" style="margin:4px 0 8px">Gem en kopi i Filer/iCloud, så du aldrig mister dine data.</div><button class="btn small" onclick="exportData()">⬇️ Gem backup</button></div>`;
}
async function exportData(){
  const name = 'min-uge-backup-' + iso(new Date()) + '.json', json = JSON.stringify(state), file = new File([json], name, { type:'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files:[file] })) await navigator.share({ files:[file], title:'Min uge – backup' });
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click(); }
  } catch (e) { if (e.name === 'AbortError') return; toast('Kunne ikke gemme backup'); return; }
  state.lastBackup = iso(new Date()); save(); toast('💾 Backup gemt'); render();
}
function importData(inp){
  const f = inp.files[0]; inp.value = ''; if (!f) return;
  f.text().then(txt => {
    let o; try { o = JSON.parse(txt); } catch(e) { toast('Filen kan ikke læses'); return; }
    if (!o || !o.days || !o.settings) { toast('Det er ikke en Min uge-backup'); return; }
    if (!confirm(`Gendan backup med ${Object.keys(o.days).length} dage? Det erstatter det, der er på telefonen nu.`)) return;
    localStorage.setItem(KEY, txt); location.reload();
  });
}
function setS(k, v){ state.settings[k] = v; save(); toast('Gemt'); header(); }
function setManual(){ const G = goalFor(); state.settings.auto = false; state.settings.kcal = G.kcal; state.settings.protein = G.p; save(); toast('Skriv dine egne mål'); render(); }
function addWeight(){ const v = parseFloat(($('#wIn').value||'').replace(',','.')); if (!(v > 30 && v < 200)) { toast('Skriv en gyldig vægt'); return; } state.weights = state.weights.filter(w => w.date !== iso(new Date())); state.weights.push({ date: iso(new Date()), kg: v }); save(); toast('Vægt gemt'); render(); }
function weightChart(ws){
  const W = 300, H = 110, pad = 24, vals = ws.map(w => w.kg), mn = Math.min(...vals, 60) - .5, mx = Math.max(...vals) + .5;
  const x = i => pad + (ws.length === 1 ? (W-2*pad)/2 : i*(W-2*pad)/(ws.length-1)), y = v => 10 + (mx - v)/(mx - mn)*(H-30);
  const pts = ws.map((w,i) => `${x(i)},${y(w.kg)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:10px">
    <line x1="${pad}" x2="${W-pad}" y1="${y(60)}" y2="${y(60)}" stroke="#a3a3a3" stroke-dasharray="4 4"/><text x="${W-pad}" y="${y(60)-4}" font-size="9" text-anchor="end" fill="#a3a3a3">60 kg</text>
    <polyline points="${pts}" fill="none" stroke="#0a0a0a" stroke-width="2.5" stroke-linejoin="round"/>
    ${ws.map((w,i) => `<circle cx="${x(i)}" cy="${y(w.kg)}" r="3.5" fill="#0a0a0a"/><text x="${x(i)}" y="${y(w.kg)-7}" font-size="8.5" text-anchor="middle" fill="#404040">${String(w.kg).replace('.',',')}</text><text x="${x(i)}" y="${H-3}" font-size="7.5" text-anchor="middle" fill="#a3a3a3">${w.date.slice(8)}/${+w.date.slice(5,7)}</text>`).join('')}
  </svg>`;
}

render();
</script>
</body>
</html>
